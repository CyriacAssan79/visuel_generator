# Moteur IA local. `active` désigne le modèle utilisé par défaut ; `choices` ceux proposés dans l'application.
# Chaque modèle a été mesuré sur cette machine (benchmarks/results/, 2026-10-18).
#   engine : « diffusers » (PyTorch, processeur) ou « openvino » (accélération Intel)
#   device : CPU (processeur) ou GPU (puce graphique Intel Iris Xe) pour OpenVINO
#   repo : dépôt Hugging Face (téléchargé au premier usage) ou, avec `path`, dépôt source du modèle converti
#   path : dossier d'un modèle converti sur la machine (voir convert_script)
#   scheduler : planificateur imposé (noms OpenVINO GenAI : EULER_ANCESTRAL_DISCRETE, DDIM, PNDM…)
#   expected_s : temps mesuré par scène en régime établi
active: lcm_ov_gpu
choices: [lcm_ov_gpu, rv51_ov_int8_gpu]
models:
  lcm_ov_gpu:
    label: "Rapide : LCM Dreamshaper v7 (≈ 6 s, image plus douce)"
    repo: "OpenVINO/LCM_Dreamshaper_v7-int8-ov"
    engine: openvino
    device: GPU
    lcm: true
    licence: "MIT"
    steps: 6
    guidance_scale: 8.0
    base_size: 512
    expected_s: 6
  rv51_ov_int8_gpu:
    label: "Qualité : Realistic Vision V5.1 (≈ 50 s, visages et mains plus fiables)"
    repo: "SG161222/Realistic_Vision_V5.1_noVAE"
    path: "~/.cache/komian/models/realistic-vision-v5.1-int8-ov"
    convert_script: "scripts/convert_realistic_vision.sh"
    engine: openvino
    device: GPU
    scheduler: EULER_ANCESTRAL_DISCRETE
    licence: "CreativeML OpenRAIL-M"
    steps: 25
    guidance_scale: 5.0
    base_size: 512
    expected_s: 50
